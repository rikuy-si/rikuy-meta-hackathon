[project]
name = "rikuy-gateway"
version = "0.1.0"
description = "Rikuy Connect FastMCP gateway: one safe contract between AI agents and camera bridges."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastmcp>=2.0",
    "fastapi>=0.115",
    "boto3>=1.35",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rikuy_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
