[package]
name = "rikuy-bridge-mocks"
description = "Mock Hikvision ISAPI device, mock Ezviz ONVIF camera and mock Rikuy backend for rikuy-bridge tests."
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "mock-isapi"
path = "src/bin/mock_isapi.rs"

[[bin]]
name = "mock-onvif"
path = "src/bin/mock_onvif.rs"

[[bin]]
name = "mock-backend"
path = "src/bin/mock_backend.rs"

[dependencies]
tiny_http = "0.12"
md-5 = "0.10"
sha2 = "0.10"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
base64 = "0.22"
sha1 = "0.10"
