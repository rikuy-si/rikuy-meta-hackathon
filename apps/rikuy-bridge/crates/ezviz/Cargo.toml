[package]
name = "rikuy-bridge-ezviz"
description = "rikuy-bridge connector for Ezviz cameras over ONVIF (Profile T live, Profile G search and replay)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["tls"]
tls = ["rikuy-bridge-common/tls"]

[[bin]]
name = "rikuy-bridge-ezviz"
path = "src/main.rs"

[dependencies]
rikuy-bridge-common.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
ureq.workspace = true
quick-xml.workspace = true
sha2.workspace = true
rand.workspace = true
sha1 = "0.10"
base64 = "0.22"
url = "2"

[dev-dependencies]
rikuy-bridge-mocks = { path = "../../mocks" }
