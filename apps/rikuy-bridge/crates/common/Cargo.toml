[package]
name = "rikuy-bridge-common"
description = "Shared contract for rikuy-bridge connectors: jobs, reports, credential envelope, liveness, backend client and daemon loop."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["tls"]
# HTTPS to the Rikuy backend (rustls). Device traffic on the LAN is plain HTTP.
tls = ["ureq/tls"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
zeroize.workspace = true
thiserror.workspace = true
ureq.workspace = true
sha2.workspace = true
md-5.workspace = true
rand.workspace = true
url = "2"
