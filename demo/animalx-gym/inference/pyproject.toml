[project]
name = "rikuy-gym"
version = "0.1.0"
description = "Gym entrance people count: RF-DETR + SAM 3 on recorder footage, reconciled against the access-control log, explained by muse-spark-1.3."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Heavy model stacks are optional so reconcile/report/build run anywhere.
detect = ["rfdetr>=1.2", "supervision>=0.25"]
segment = ["sam3", "torch>=2.5", "pillow>=10"]
test = ["pytest>=8"]

[project.scripts]
rikuy-gym = "rikuy_gym.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rikuy_gym"]
