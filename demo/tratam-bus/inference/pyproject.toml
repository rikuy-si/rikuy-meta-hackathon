[project]
name = "rikuy-bus"
version = "0.1.0"
description = "Bus cabin boardings vs. fare counter: SAM 3 occupancy, boarding candidates, web audit."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
segment = ["rikuy-gym[segment]"]
test = ["pytest>=8"]

[project.scripts]
rikuy-bus = "rikuy_bus.cli:main"

[tool.uv.sources]
rikuy-gym = { path = "../../animalx-gym/inference", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rikuy_bus"]
