<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rikuy · Audit · Entrance turnstile</title>
<link rel="preload" href="../fonts/onest-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="rikuy.css">
</head>
<body>
<div class="bg"><i></i><i></i></div>
<div class="wrap">
  <header class="top">
    <div class="logo">rikuy<b></b></div>
    <nav class="cases"><a href="index.html" aria-current="page" data-i="caseGym"></a></nav>
    <div class="crumb"><span data-i="crumb1"></span><span>›</span><strong data-i="crumb2"></strong></div>
    <div class="sp"></div>
    <div class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="es">ES</button></div>
    <button class="pill y" id="exportTop" data-i="export"></button>
  </header>

  <section class="hero">
    <div class="rise">
      <div class="eyebrow"><i></i><span data-i="eyebrow"></span></div>
      <h1 data-i="h1" data-html></h1>
      <p class="lead" data-i="lead"></p>
    </div>
    <div class="ask rise" style="animation-delay:.15s" id="ask">
      <div class="q"><span data-i="question"></span></div>
      <div class="a"><div class="av">M</div><p id="answer"><span class="typing"><i></i><i></i><i></i></span></p></div>
      <div class="meta" id="askmeta"></div>
    </div>
  </section>

  <section class="kpis" id="kpis"></section>

  <section class="stage">
    <div class="player rise" style="animation-delay:.25s">
      <div class="screen" id="screen">
        <video id="video" preload="auto" muted playsinline></video>
        <canvas id="ov"></canvas>
        <div class="hud">
          <div class="chip rec"><i></i><span data-i="cam"></span></div>
          <div class="chip"><span data-i="camclock"></span> <b id="hudCam">--:--:--</b></div>
          <div class="chip"><span data-i="accclock"></span> <b id="hudAcc">--:--:--</b></div>
        </div>
        <div class="hud-r">
          <div class="chip" id="hudMin"></div>
        </div>
        <div class="banner" id="banner"></div>
        <div class="gapnote" id="gapnote"><div><b data-i="gapTitle"></b><span id="gapText"></span></div></div>
      </div>
      <div class="controls">
        <button class="cbtn play" id="play" aria-label="Play">▶</button>
        <button class="cbtn" data-step="-10">−10s</button><button class="cbtn" data-step="-1">−1s</button>
        <button class="cbtn" data-step="-0.2">‹</button><button class="cbtn" data-step="0.2">›</button>
        <button class="cbtn" data-step="1">+1s</button><button class="cbtn" data-step="10">+10s</button>
        <span class="sep"></span>
        <button class="cbtn" id="prevEv" data-i="prevEv"></button><button class="cbtn" id="nextEv" data-i="nextEv"></button>
        <span class="sep"></span>
        <button class="cbtn" id="speed">1×</button>
        <span class="sep"></span>
        <button class="cbtn" data-ov="masks" aria-pressed="true" data-i="ovMasks"></button>
        <button class="cbtn" data-ov="boxes" aria-pressed="true" data-i="ovBoxes"></button>
        <button class="cbtn" data-ov="line" aria-pressed="true" data-i="ovLine"></button>
        <span class="sp"></span>
        <span class="clock" id="clock"></span>
      </div>
      <div class="legend">
        <span><i class="sw" style="background:#7fccb466;outline:1px solid #7fccb4"></i><span data-i="lgMask"></span></span>
        <span><i class="sw" style="background:transparent;outline:1.5px solid #fff"></i><span data-i="lgBox"></span></span>
        <span><i class="sw" style="background:#dce064"></i><span data-i="lgLine"></span></span>
        <span><i class="sw" style="background:#7fccb4;border-radius:50%;width:10px;height:10px"></i><span data-i="lgCrossOk"></span></span>
        <span><i class="sw" style="background:#e0644f;border-radius:50%;width:10px;height:10px"></i><span data-i="lgCross"></span></span>
      </div>
    </div>

    <aside class="side rise" style="animation-delay:.35s">
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="records"></button><button role="tab" data-tab="entries"></button><button role="tab" data-tab="exits"></button>
      </div>
      <div class="progress"><span id="revText"></span><span class="track"><i id="revBar"></i></span></div>
      <div class="filters" id="filters"></div>
      <div class="list" id="list"></div>
      <div class="foot"><button class="pill g" id="exportCsv" data-i="exportCsv"></button><button class="pill g" id="exportJson" data-i="exportJson"></button></div>
    </aside>
  </section>

  <section class="card" id="flowCard">
    <h2 data-i="flowTitle"></h2>
    <p class="sub" data-i="flowSub"></p>
    <div class="flow" id="flow"></div>
  </section>

  <section class="card">
    <h2 data-i="tlTitle"></h2>
    <p class="sub" data-i="tlSub"></p>
    <div class="tl" id="tl"></div>
    <div class="tlkey" id="tlkey"></div>
    <div class="tl" id="tlz"></div>
  </section>

  <section class="grid3" id="insights"></section>
  <section class="method" id="method"></section>
</div>
<div class="toast" id="toast"></div>
<div class="cap" id="cap"></div>

<script src="data/audit.js"></script>
<script src="data/overlay.js" defer></script>
<script src="data/overlay_hd.js" defer></script>
<script>
(() => {
const A = window.AUDIT;
const T = {
en: {
  caseGym: "Gym", caseBus: "Bus",
  crumb1: "Audit", crumb2: "Entrance turnstile · Oct 29 · 05:30–06:45",
  export: "Export review", eyebrow: "People flow · peak hour",
  h1: "Every person in, every person out. <em>Counted</em> by the camera you already have.",
  lead: "Rikuy reads the entrance camera on-premises: who comes in, who leaves, when the rush hits. Then it puts your access log on the same clock, so the numbers you run the business on are people.",
  question: "How did people move through the entrance this morning?",
  cam: "CAM 01 · ENTRANCE", camclock: "camera", accclock: "access log",
  gapTitle: "No footage here", gapText: "The recorder stores motion only. Nothing moved in view from {a} to {b}.",
  prevEv: "◂ event", nextEv: "event ▸", ovMasks: "Masks", ovBoxes: "Boxes", ovLine: "Line",
  lgMask: "SAM 3 person mask (Meta)", lgBox: "Tracked person", lgLine: "Turnstile line · inside is up", lgCrossOk: "Entry with check-in", lgCross: "Entry without check-in",
  tabs: { records: "Records", entries: "Entries", exits: "Exits" },
  filters: { all: "All", confirmed: "Confirmed", phantom: "Nobody seen", recorded: "Recorded", unrecorded: "No record", unreviewed: "Unreviewed" },
  verdict: { confirmed: "On camera", phantom: "Nobody seen", recorded: "Recorded", unrecorded: "No record", exit: "Exit" },
  recSub: { confirmed: "Matched to entry {e} · camera {t}", phantom: "Nobody crossed the turnstile" },
  entSub: { recorded: "Matches record {r}", unrecorded: "Walked in, no check-in", tg: " · {g}s after the previous entry" },
  exitSub: "Left through the turnstile",
  agree: "Agree", disagree: "Disagree", reviewed: "{n} of {t} reviewed",
  exportCsv: "Export CSV", exportJson: "Export JSON",
  kpi: [
    ["entries", "people walked in", "05:30–06:45"],
    ["exits", "people walked out", ""],
    ["rush", "came in during the busiest 10 minutes", ""],
    ["pace", "between arrivals · median", ""],
    ["logged", "entries matched a check-in", "05:44–06:38"]
  ],
  rushSub: "· {o} out", rushTag: "{a}–{b}",
  flowTitle: "People in, people out", flowSub: "Turnstile crossings on camera, every 5 minutes. Click a bar to jump there.", flowIn: "Entries", flowOut: "Exits",
  tlTitle: "One clock, two sources", tlSub: "Access-log check-ins above, people crossing the turnstile below. Click anywhere to jump to that second. Shaded: check-ins with nobody at the turnstile.",
  lanes: ["Access log", "Entries on camera", "Exits", "Footage"],
  key: ["Check-in confirmed", "Check-in, nobody seen", "Entry with record", "Entry without record", "Exit", "Recorded footage", "Playhead"],
  burst: "check-ins, nobody seen",
  zoom: "±5 min around the playhead",
  ins: [
    ["Rush hour", "32 of 46 crossings in 10 minutes.", "From 05:55 to 06:05, 19 people came in while 13 left: more movement than the rest of the morning combined. That is when the front desk, the floor and the lockers are under pressure, measured instead of guessed."],
    ["Records vs. reality", "1 in 3 entries left no check-in.", "In the validated window 24 people walked in and 16 had a check-in. Earlier, 23 check-ins were logged in six minutes with nobody at the turnstile. Both are lines to reconcile, not verdicts: the owner reviews each one."],
    ["What it takes", "No new hardware. Flows, not identities.", "The camera and the access software were already there. Rikuy measures on-premises, counts crossings without recognizing anyone and hands the owner a list to confirm in minutes."]
  ],
  method: [
    ["Records", "Access-control export, per minute, no identities. 39 granted check-ins between 05:30 and 06:45."],
    ["Measurement", "Original footage measured on-premises: person detector + tracking at 5 fps, net crossing of the turnstile line. SAM 3 (Meta) segments every person for the evidence layer: every frame from 05:56 to 06:06, 2 fps elsewhere."],
    ["Clock", "Camera runs 24 s behind the access log, set by the owner from the footage. Each check-in pairs with an entry in its minute ±1."],
    ["Limits", "Estimates, not verdicts: every row waits for the owner's review. The recorder stores motion only, so gaps mean nothing moved in view. No face recognition, no identities."]
  ],
  muse: "Muse Spark", logged: "Logged by Rikuy", gapSkipped: "Skipped {s} with no footage",
  bannerPhantom: "Access log: <b>{n} check-ins</b> this minute · camera: nobody at the turnstile",
  bannerEntry: "{id} · entry at {t}", bannerExit: "{id} · exit at {t}", noOverlay: "Overlays loading…", minNobody: "nobody seen"
},
es: {
  caseGym: "Gimnasio", caseBus: "Bus",
  crumb1: "Auditoría", crumb2: "Torniquete de entrada · 29 oct · 05:30–06:45",
  export: "Exportar revisión", eyebrow: "Flujo de personas · hora pico",
  h1: "Cada persona que entra, cada persona que sale. <em>Contadas</em> con la cámara que ya tienes.",
  lead: "Rikuy lee la cámara de la entrada en el local: quién entra, quién sale, cuándo se llena. Luego pone tu registro de acceso en el mismo reloj, para que las cifras con que operas sean personas.",
  question: "¿Cómo se movió la gente por la entrada esta mañana?",
  cam: "CAM 01 · ENTRADA", camclock: "cámara", accclock: "registro",
  gapTitle: "Sin grabación aquí", gapText: "El grabador solo guarda movimiento. Nada se movió a la vista de {a} a {b}.",
  prevEv: "◂ evento", nextEv: "evento ▸", ovMasks: "Máscaras", ovBoxes: "Cajas", ovLine: "Línea",
  lgMask: "Máscara de persona SAM 3 (Meta)", lgBox: "Persona seguida", lgLine: "Línea del torniquete · adentro es arriba", lgCrossOk: "Entrada con registro", lgCross: "Entrada sin registro",
  tabs: { records: "Registros", entries: "Entradas", exits: "Salidas" },
  filters: { all: "Todos", confirmed: "Confirmados", phantom: "Sin persona", recorded: "Registradas", unrecorded: "Sin registro", unreviewed: "Sin revisar" },
  verdict: { confirmed: "En cámara", phantom: "Sin persona", recorded: "Registrada", unrecorded: "Sin registro", exit: "Salida" },
  recSub: { confirmed: "Casa con la entrada {e} · cámara {t}", phantom: "Nadie cruzó el torniquete" },
  entSub: { recorded: "Casa con el registro {r}", unrecorded: "Entró sin registrarse", tg: " · {g}s después de la entrada anterior" },
  exitSub: "Salió por el torniquete",
  agree: "De acuerdo", disagree: "No", reviewed: "{n} de {t} revisados",
  exportCsv: "Exportar CSV", exportJson: "Exportar JSON",
  kpi: [
    ["entries", "personas entraron", "05:30–06:45"],
    ["exits", "personas salieron", ""],
    ["rush", "entraron en los 10 minutos de mayor flujo", ""],
    ["pace", "entre llegadas · mediana", ""],
    ["logged", "entradas casaron con un registro", "05:44–06:38"]
  ],
  rushSub: "· {o} salen", rushTag: "{a}–{b}",
  flowTitle: "Entran y salen", flowSub: "Cruces del torniquete en cámara, cada 5 minutos. Haz clic en una barra para ir ahí.", flowIn: "Entradas", flowOut: "Salidas",
  tlTitle: "Un reloj, dos fuentes", tlSub: "Arriba los ingresos del registro, abajo las personas que cruzan el torniquete. Haz clic para ir a ese segundo. Sombreado: ingresos sin nadie en el torniquete.",
  lanes: ["Registro", "Entradas en cámara", "Salidas", "Grabación"],
  key: ["Ingreso confirmado", "Ingreso sin persona", "Entrada con registro", "Entrada sin registro", "Salida", "Grabación disponible", "Cursor"],
  burst: "ingresos sin persona",
  zoom: "±5 min alrededor del cursor",
  ins: [
    ["Hora pico", "32 de 46 cruces en 10 minutos.", "De 05:55 a 06:05 entraron 19 personas mientras salían 13: más movimiento que todo el resto de la mañana. Es cuando la recepción, la sala y los camarines están bajo presión, medido en vez de supuesto."],
    ["Registros vs. realidad", "1 de cada 3 entradas sin registro.", "En la franja validada entraron 24 personas y 16 tenían registro. Antes, 23 ingresos se registraron en seis minutos sin nadie en el torniquete. Son líneas por conciliar, no veredictos: el dueño revisa cada una."],
    ["Lo que se necesita", "Sin hardware nuevo. Flujos, no identidades.", "La cámara y el software de acceso ya estaban. Rikuy mide en el local, cuenta cruces sin reconocer a nadie y le entrega al dueño una lista para confirmar en minutos."]
  ],
  method: [
    ["Registros", "Exportación del control de acceso, por minuto, sin identidades. 39 ingresos concedidos entre 05:30 y 06:45."],
    ["Medición", "Grabación original medida en el local: detector de personas + seguimiento a 5 fps, cruce neto de la línea del torniquete. SAM 3 (Meta) segmenta a cada persona para la capa de evidencia: cada cuadro de 05:56 a 06:06, 2 fps en el resto."],
    ["Reloj", "La cámara va 24 s detrás del registro, fijado por el dueño desde la grabación. Cada ingreso se empareja con una entrada en su minuto ±1."],
    ["Límites", "Estimaciones, no veredictos: cada fila espera la revisión del dueño. El grabador solo guarda movimiento, así que un hueco significa que nada se movió a la vista. Sin reconocimiento facial, sin identidades."]
  ],
  muse: "Muse Spark", logged: "Registrado por Rikuy", gapSkipped: "Se saltaron {s} sin grabación",
  bannerPhantom: "Registro: <b>{n} ingresos</b> en este minuto · cámara: nadie en el torniquete",
  bannerEntry: "{id} · entrada a las {t}", bannerExit: "{id} · salida a las {t}", noOverlay: "Cargando capas…", minNobody: "sin persona"
}};
let lang = new URLSearchParams(location.search).get("lang") === "es" ? "es" : (localStorage.getItem("rikuy.audit.lang") || "en");
const t = (k) => k.split(".").reduce((o, p) => o?.[p], T[lang]);
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? "");
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ---------- time ---------- */
const ms = (iso) => Date.parse(iso);
const W0 = ms(A.window.from), W1 = ms(A.window.to);
const WALL0 = (() => { const [h, m, s] = A.window.from.slice(11, 19).split(":").map(Number); return h * 3600 + m * 60 + s; })();
const OFF = A.clock_offset_s * 1000;
const hms = (epoch, sub) => { let s = WALL0 + (epoch - W0) / 1000; s = ((s % 86400) + 86400) % 86400; const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${(sub ? x.toFixed(1).padStart(4, "0") : String(Math.floor(x)).padStart(2, "0"))}`; };
const segs = A.video.segments.map((s) => ({ ...s, c0: ms(s.cam_start), c1: ms(s.cam_start) + s.duration * 1000 }));
const camAt = (vt) => { const s = segs.findLast((x) => x.video_start <= vt + 1e-6) || segs[0]; return { seg: s, cam: s.c0 + (vt - s.video_start) * 1000 }; };
const vtAt = (cam) => { const s = segs.find((x) => cam < x.c1); if (!s) return { vt: A.video.total - 0.05, gap: false }; if (cam < s.c0) return { vt: s.video_start, gap: true, from: cam, to: s.c0 };
  return { vt: s.video_start + (cam - s.c0) / 1000, gap: false }; };

/* ---------- data ---------- */
const recs = A.records.map((r) => ({ ...r, kind: "records", cam: ms(r.cam_ts) }));
const ents = A.entries.map((e) => ({ ...e, kind: "entries", camMs: ms(e.cam), v: e.verdict }));
const exts = A.exits.map((x, i) => ({ ...x, id: `X${String(i + 1).padStart(2, "0")}`, kind: "exits", camMs: ms(x.cam), v: "exit" }));
const entById = Object.fromEntries(ents.map((e) => [e.id, e]));
const events = [...ents.map((e) => ({ cam: e.camMs, ref: e })), ...exts.map((x) => ({ cam: x.camMs, ref: x }))].sort((a, b) => a.cam - b.cam);
const phantomMin = {}; recs.forEach((r) => { if (r.verdict === "phantom") phantomMin[r.minute] = (phantomMin[r.minute] || 0) + 1; });
const st = A.stats;
const BIN = 300000, accMs = (o) => o.camMs - OFF;
const flow = Array.from({ length: Math.floor((W1 - W0) / BIN) }, (_, i) => ({ a: W0 + i * BIN, in: 0, out: 0 }));
for (const [k, list] of [["in", ents], ["out", exts]]) for (const o of list) { const i = Math.floor((accMs(o) - W0) / BIN); if (flow[i]) flow[i][k]++; }
const rush = () => flow.slice(0, -1).map((b, i) => ({ a: b.a, in: b.in + flow[i + 1].in, out: b.out + flow[i + 1].out })).reduce((m, x) => x.in > m.in ? x : m);

/* ---------- review store ---------- */
const RK = "rikuy.audit.review.v1";
let review = JSON.parse(localStorage.getItem(RK) || "{}");
const saveReview = () => localStorage.setItem(RK, JSON.stringify(review));

/* ---------- i18n render ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  $$("[data-i]").forEach((el) => { const v = t(el.dataset.i); if (typeof v !== "string") return; if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v; });
  $$(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  renderKpis(); renderTabs(); renderList(); renderTimeline(); renderInsights(); if (typed) renderAnswer(false);
}
$$(".lang button").forEach((b) => b.onclick = () => { lang = b.dataset.lang; localStorage.setItem("rikuy.audit.lang", lang); applyLang(); });

/* ---------- KPIs ---------- */
function countUp(el, to, dur = 1300, dec = 0) { const t0 = performance.now(); const step = (now) => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
  el.firstChild.nodeValue = (to * e).toFixed(dec); if (p < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); }
let kpiDone = false;
function renderKpis() {
  const r = rush();
  const vals = { entries: [ents.length, ""], exits: [exts.length, ""], rush: [r.in, fmt(t("rushSub"), { o: r.out })],
    pace: [Math.round(st.median_gap_s), "s"], logged: [st.validated.recorded, `/ ${st.validated.entries}`] };
  const tags = { rush: fmt(t("rushTag"), { a: hms(r.a).slice(0, 5), b: hms(r.a + 600000).slice(0, 5) }) };
  const cls = { entries: "dark" };
  const bars = { entries: "var(--amarillo)", exits: "#a9b6d3", rush: "var(--teal)", pace: "var(--menta)", logged: "var(--amarillo)" };
  $("#kpis").innerHTML = t("kpi").map(([k, l, tag], i) => (tag = tag || tags[k], `<div class="kpi ${cls[k] || ""} rise" style="animation-delay:${.08 * i}s">${tag ? `<span class="tag">${tag}</span>` : ""}
    <div class="n"><span>${kpiDone ? vals[k][0] : 0}</span><small>${vals[k][1]}</small></div><div class="l">${l}</div><i class="bar" style="background:${bars[k]};animation-delay:${.3 + .08 * i}s"></i></div>`)).join("");
  if (!kpiDone) { $$("#kpis .n span").forEach((el, i) => countUp(el, Object.values(vals)[i][0], 1300 + i * 120)); kpiDone = true; }
}

/* ---------- Muse answer ---------- */
let typed = false;
function renderAnswer(animate = true) {
  const m = A.muse; const el = $("#answer");
  if (!m) { el.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>'; return; }
  const text = (m.answer[lang] || m.answer.en);
  const html = text.replace(/\[([ERX]\d{2})\]/g, (_, id) => `<button class="cite" data-jump="${id}">${id} · ${labelTime(id)}</button>`).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  $("#askmeta").innerHTML = `<span>${t("muse")} · ${m.model}</span><span>${m.latency_s}s</span><span>${t("logged")} · ${m.look || "CAM 01 · 05:30–06:45"}</span>`;
  if (!animate || typed) { el.innerHTML = html; return; }
  typed = true; el.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  setTimeout(() => { el.innerHTML = html; el.animate([{ opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "none" }], { duration: 700, easing: "cubic-bezier(.2,.7,.2,1)" }); }, 1100);
}
const byId = (id) => recs.find((r) => r.id === id) || entById[id] || exts.find((x) => x.id === id);
const labelTime = (id) => { const o = byId(id); if (!o) return ""; return hms(o.kind === "records" ? ms(o.access_ts) : o.camMs - OFF); };
document.addEventListener("click", (e) => { const j = e.target.closest("[data-jump]"); if (j) { const o = byId(j.dataset.jump); if (o) select(o, true); } });

/* ---------- list ---------- */
let tab = "records", filter = "all", selected = null;
function renderTabs() {
  const n = { records: recs.length, entries: ents.length, exits: exts.length };
  $$("#tabs button").forEach((b) => { b.innerHTML = `${t("tabs")[b.dataset.tab]}<small>${n[b.dataset.tab]}</small>`; b.setAttribute("aria-selected", String(b.dataset.tab === tab));
    b.onclick = () => { tab = b.dataset.tab; filter = "all"; renderTabs(); renderList(); }; });
  const opts = tab === "records" ? ["all", "confirmed", "phantom", "unreviewed"] : tab === "entries" ? ["all", "recorded", "unrecorded", "unreviewed"] : ["all"];
  $("#filters").innerHTML = opts.map((o) => `<button data-f="${o}" aria-pressed="${o === filter}">${t("filters")[o]}</button>`).join("");
  $$("#filters button").forEach((b) => b.onclick = () => { filter = b.dataset.f; renderTabs(); renderList(); });
}
function items() { return tab === "records" ? recs : tab === "entries" ? ents : exts; }
function renderList() {
  const list = items().filter((o) => filter === "all" || (filter === "unreviewed" ? !review[o.id] : (o.verdict || o.v) === filter));
  $("#list").innerHTML = list.map((o, i) => {

    [14000, "scroll", ".kpis"], [14500, "cap", "26 entran, 20 salen, <em>19 llegadas en diez minutos.</em>"],
    [21000, "scroll", ".stage"], [21500, "jump", "R05"], [22000, "cap", "05:39. El registro se llena de ingresos. En el torniquete: <em>nadie.</em> Una línea por conciliar."],
    [29000, "play"], [33000, "jump", "R24"], [33500, "cap", "Un ingreso real, emparejado con la persona que cruza, <em>al segundo.</em>"],
    [42000, "jump", "E07"], [42500, "cap", "Y personas que entraron <em>sin ningún registro.</em>"],

    [69000, "scroll", ".stage"], [69500, "review", "E07"], [70000, "cap", "El dueño revisa cada hallazgo y <em>exporta la lista.</em>"],

  ]
};
function runTour() {
  const cap = $("#cap"); typed = true; $("#answer").innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  const steps = TOUR[lang]; const t0 = performance.now(); window.__tourDone = false;
  const act = ([, k, v]) => {
    if (k === "cap") { cap.classList.remove("on"); setTimeout(() => { cap.innerHTML = v; cap.classList.add("on"); }, 350); }
    if (k === "answer") { typed = false; renderAnswer(true); }
    if (k === "scroll") { const el = $(v); window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - 24, behavior: "smooth" }); if (v === ".kpis") { kpiDone = false; renderKpis(); } }
    if (k === "jump") { const o = byId(v); select(o, true); const r = $(`#list .row[data-id="${v}"]`); r?.classList.add("spot"); setTimeout(() => r?.classList.remove("spot"), 2600); }
    if (k === "play") { stopAt = null; video.play(); }
    if (k === "review") { const o = byId(v); if (tab !== o.kind) { tab = o.kind; renderTabs(); } review[v] = "agree"; saveReview(); renderList();
      const b = $("#exportCsv"); b.classList.add("spot"); setTimeout(() => b.classList.remove("spot"), 2500); }
    if (k === "end") { cap.classList.remove("on"); video.pause(); window.__tourDone = true; }
  };
  let i = 0; const tick = () => { const now = performance.now() - t0; while (i < steps.length && steps[i][0] <= now) act(steps[i++]); if (i < steps.length) requestAnimationFrame(tick); };
  tick();
}
window.__audit.tour = runTour;
if (new URLSearchParams(location.search).get("tour")) video.addEventListener("canplay", () => setTimeout(runTour, 800), { once: true });
})();
